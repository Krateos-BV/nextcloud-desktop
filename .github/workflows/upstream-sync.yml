name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/nextcloud/desktop.git || true
          git fetch upstream master

      - name: Check drift
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on sync branch
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="sync/upstream-$DATE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config user.name "xenia-sync-bot"
          git config user.email "bot@xeniacloud.eu"
          if git merge --no-commit --no-ff upstream/master; then
            # GITHUB_TOKEN can never push changes to .github/workflows/ — GitHub
            # hard-blocks it regardless of granted permissions, to stop a workflow
            # from self-modifying/escalating other workflows. Keep this fork's own
            # workflow files as-is rather than failing every sync run over it.
            git checkout --no-overlay HEAD -- .github/workflows/
            git commit --no-edit
            echo "status=clean" >> "$GITHUB_OUTPUT"
            git push origin "$BRANCH"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
          fi

      - name: Open PR (clean)
        if: steps.merge.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh pr create` drives GitHub's GraphQL createPullRequest mutation, which enforces a
          # stricter/buggier permission check than the equivalent REST endpoint for GITHUB_TOKEN
          # on forked repos — it 403s ("Resource not accessible by integration") even when the
          # REST call with the same token succeeds. Use REST directly instead (INF-225).
          gh api repos/${{ github.repository }}/pulls \
            -f title="Upstream sync: ${{ steps.merge.outputs.branch }}" \
            -f body="Automated merge of nextcloud/desktop:master (${{ steps.check.outputs.behind }} commits behind). Review before merging — theme/colored/* is a rebrand collision point even on clean merges." \
            -f base="master" -f head="${{ steps.merge.outputs.branch }}"

      - name: Report conflict (fail run)
        if: steps.merge.outputs.status == 'conflict'
        run: |
          # Issues are disabled on this repo, so `gh issue create` isn't an option here — fail
          # the run instead and surface the conflict details in the job summary, so the failed
          # scheduled run itself (and its notification) is the alert.
          {
            echo "## Upstream sync conflict: $(date +%Y-%m-%d)"
            echo
            echo "Merge of nextcloud/desktop:master (${{ steps.check.outputs.behind }} commits behind) hit conflicts in:"
            echo
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Resolve manually:"
            echo
            echo '```'
            echo "git fetch upstream master && git checkout master && git checkout -b sync/upstream-manual && git merge upstream/master"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
